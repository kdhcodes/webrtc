# The README's WPT badge (wpt.json, a shields.io endpoint: subtests passed)
# and the results page it links to (WPT.md), from the WPT results of a CI
# run that succeeded on a push to main, pushed to the `badges` branch.
# CONTRIBUTING-AGENTS.md, "CI and releases".
#
# A workflow of its own, after CI rather than in it, so a failed badge push
# never fails a CI run (which releases require to have passed). It runs
# main's own workflow and scripts (a workflow_run run always uses the default
# branch's), never a pull request's code, and reads only the results
# artifact of a push to main in this repository.
name: WPT badge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One push to the badges branch at a time; the newest waiting run wins.
concurrency:
  group: wpt-badge
  cancel-in-progress: false

permissions: {}

jobs:
  badge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # the CI run's artifact
      contents: write # pushes the badges branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: wpt-out-linux-x64
          path: wpt-out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Write the badge and the results page
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/wpt-report.mjs --out "$RUNNER_TEMP/badges" --results wpt-out/ours.json \
            --commit "$COMMIT" --date "$(date -u +%F)" --platform linux-x64 \
            --repo "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/badges/wpt.json"
      # A fresh repo holding only wpt.json and WPT.md, force-pushed as the
      # branch's single commit, so it never grows.
      - name: Push them to the badges branch
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add wpt.json WPT.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "WPT results for $COMMIT"
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:badges
