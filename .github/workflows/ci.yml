# Build and test on every supported platform, against our libwebrtc builds
# from the libwebrtc-<config id> release (scripts/libwebrtc-assets.sh), so
# nothing here builds libwebrtc. CONTRIBUTING-AGENTS.md, "CI and releases".
#
# - lint: Biome, clang-format and tsc, once (none of it is per platform).
# - darwin-arm64: on the runner, as on a Mac: pnpm run build (node-gyp,
#   Xcode's clang), then the tests.
# - linux-x64, linux-arm64: docker/linux.Dockerfile, the image the local
#   Linux runs use, so the addon links (and gets its glibc floor) the way the
#   released binaries do; the tests run in it, and WPT too on linux-x64.
# Not here: the Chrome interop tests (test/interop) and test/sfu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # What the devenv shell has; the Docker image installs the latest.
  NODE_GYP_VERSION: "13.1.0"
  # Must match the clang-format the code was formatted with (devenv's).
  CLANG_FORMAT_VERSION: "21.1.8"

jobs:
  lint:
    name: lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install "clang-format==$CLANG_FORMAT_VERSION"
      - run: pnpm run lint
      - run: pnpm run typecheck

  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/libwebrtc
        with:
          triple: darwin-arm64
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: npm install -g "node-gyp@$NODE_GYP_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:exit

  linux:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64
            runner: ubuntu-24.04
            wpt: true
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
            wpt: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - id: libwebrtc
        uses: ./.github/actions/libwebrtc
        with:
          triple: ${{ matrix.triple }}
      - uses: docker/setup-buildx-action@v3
      # The image's build stage runs pnpm install, pnpm run build and
      # typecheck. Its layers are cached per platform: the toolchain ones
      # (apt, clang, Node) are what take the time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux.Dockerfile
          target: test
          build-contexts: libwebrtc=${{ steps.libwebrtc.outputs.dir }}
          load: true
          tags: wrtc-ci
          cache-from: type=gha,scope=${{ matrix.triple }}
          cache-to: type=gha,mode=max,scope=${{ matrix.triple }}
      - name: pnpm test && pnpm run test:exit
        run: docker run --rm wrtc-ci
      - name: pnpm run wpt
        if: matrix.wpt
        run: |
          mkdir -p wpt-out
          docker run --rm -v "$PWD/wpt-out:/src/test/wpt/out" wrtc-ci pnpm run wpt
      - name: WPT results
        if: failure() && matrix.wpt
        uses: actions/upload-artifact@v4
        with:
          name: wpt-out-${{ matrix.triple }}
          path: wpt-out
          if-no-files-found: ignore
