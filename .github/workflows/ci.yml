# Build and test on every supported platform, against our libwebrtc builds
# from the libwebrtc-<config id> release (scripts/libwebrtc-assets.sh), so
# nothing here builds libwebrtc. CONTRIBUTING-AGENTS.md, "CI and releases".
#
# - lint: Biome, clang-format and tsc, once (none of it is per platform).
# - darwin-arm64: on the runner, as on a Mac: pnpm run build (node-gyp, the
#   image's newest Xcode, whose clang is 21 as locally), then the tests.
# - linux-x64, linux-arm64: docker/linux.Dockerfile, the image the local
#   Linux runs use, so the addon links (and gets its glibc floor) the way the
#   released binaries do; the tests run in it, and WPT too on linux-x64.
# The README's WPT badge and results page come from linux-x64's WPT results
# artifact, after a successful run on main (wpt-badge.yml).
# Not here: the Chrome interop tests (test/interop) and test/sfu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer push cancels its older run. Every push to main
# runs to the end: the release workflow requires CI to have passed on the
# commit it releases.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # What the devenv shell has; the Docker image installs the latest.
  NODE_GYP_VERSION: "13.1.0"
  # Must match the clang-format the code was formatted with (devenv's).
  CLANG_FORMAT_VERSION: "21.1.8"

jobs:
  lint:
    name: lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install "clang-format==$CLANG_FORMAT_VERSION"
      - run: pnpm run lint
      - run: pnpm run typecheck

  darwin-arm64:
    # macos-26's default Xcode is the newest on the image (26.6, Apple clang
    # 21); macos-15's is 16.4 (clang 17). Released binaries build here too.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/libwebrtc
        with:
          triple: darwin-arm64
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Toolchain
        run: |
          xcodebuild -version
          clang --version
      - run: npm install -g "node-gyp@$NODE_GYP_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:exit

  linux:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64
            runner: ubuntu-24.04
            wpt: true
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
            wpt: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: libwebrtc
        uses: ./.github/actions/libwebrtc
        with:
          triple: ${{ matrix.triple }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image's toolchain and deps stages (apt, clang, Node, then
      # node_modules) are what take the time, and don't depend on libwebrtc:
      # only they go to the Actions cache, never the libwebrtc layer.
      - name: Toolchain and dependencies (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/linux.Dockerfile
          target: deps
          cache-from: type=gha,scope=deps-${{ matrix.triple }}
          cache-to: type=gha,mode=max,scope=deps-${{ matrix.triple }}
      # The build stage: pnpm run build and typecheck, against libwebrtc.
      # It reads the deps cache but writes none (that would export libwebrtc).
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/linux.Dockerfile
          target: test
          build-contexts: libwebrtc=${{ steps.libwebrtc.outputs.dir }}
          cache-from: type=gha,scope=deps-${{ matrix.triple }}
          load: true
          tags: wrtc-ci
      - name: pnpm test && pnpm run test:exit
        run: docker run --rm wrtc-ci
      - name: pnpm run wpt
        if: matrix.wpt
        run: |
          mkdir -p wpt-out
          docker run --rm -v "$PWD/wpt-out:/src/test/wpt/out" wrtc-ci pnpm run wpt
      # The raw results: for digging into a failure, and for wpt-badge.yml.
      - name: WPT results
        if: matrix.wpt && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: wpt-out-${{ matrix.triple }}
          path: wpt-out
          if-no-files-found: ignore
